<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>🎮 ARCADE P2P</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #game {
            width: 100%;
            height: 100vh;
            background: #000;
        }

        #status-panel {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            padding: 12px 24px;
            border-radius: 10px;
            border: 2px solid #4d96ff;
            color: white;
            font-size: 14px;
            z-index: 9999;
            text-align: center;
            min-width: 300px;
            max-width: 90%;
            pointer-events: none;
            transition: all 0.3s;
        }

        #status-panel .titulo {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        #status-panel .detalle {
            font-size: 13px;
            color: #aaa;
        }

        #status-panel.ok {
            border-color: #2ecc71;
        }

        #status-panel.error {
            border-color: #e74c3c;
        }

        #status-panel.cargando {
            border-color: #f39c12;
        }

        #controles {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 10000;
            padding: 10px;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.7);
        }

        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            min-width: 80px;
            transition: transform 0.1s;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.9);
        }

        .btn-coin {
            background: #f1c40f;
            color: #000;
        }

        .btn-start {
            background: #2ecc71;
            color: #000;
        }

        .btn-quit {
            background: #e74c3c;
            color: #fff;
        }

        .btn-fullscreen {
            background: #3498db;
            color: #fff;
        }

        @media (max-width: 500px) {
            .btn {
                padding: 14px 20px;
                font-size: 15px;
                min-width: 60px;
            }

            #status-panel {
                font-size: 12px;
                min-width: 200px;
                padding: 8px 16px;
            }

            #status-panel .titulo {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div id="status-panel" class="cargando">
        <div class="titulo" id="statusTitulo">⏳ Iniciando...</div>
        <div class="detalle" id="statusDetalle">
            Preparando emulador...
        </div>
    </div>

    <div id="game"></div>

    <div id="controles">
        <button class="btn btn-coin" id="btnCoin">
            💰 Moneda
        </button>

        <button class="btn btn-start" id="btnStart">
            ▶ Start
        </button>

        <button class="btn btn-fullscreen" id="btnFullscreen">
            ⛶ Pantalla
        </button>

        <button class="btn btn-quit" id="btnQuit">
            ✕ Salir
        </button>
    </div>


    <script>

        // ============================================================
        // CONFIGURACIÓN
        // ============================================================

        const MI_ROM = "./kof96ep.zip";
        const MI_BIOS = "./neogeo.zip";
        const NOMBRE_JUEGO = "KOF 96 EP";


        // ============================================================
        // ELEMENTOS
        // ============================================================

        const statusTitulo =
            document.getElementById("statusTitulo");

        const statusDetalle =
            document.getElementById("statusDetalle");

        const statusPanel =
            document.getElementById("status-panel");


        function setStatus(titulo, detalle, tipo = "cargando") {

            statusTitulo.textContent = titulo;
            statusDetalle.textContent = detalle;
            statusPanel.className = tipo;

            console.log("📌", titulo, "-", detalle);
        }


        // ============================================================
        // VERIFICAR ROM Y BIOS
        // ============================================================

        async function verificarArchivo(nombre, tipo) {

            try {

                const respuesta = await fetch(nombre, {
                    method: "HEAD",
                    cache: "no-store"
                });

                if (!respuesta.ok) {

                    console.error(
                        "❌ No encontrado:",
                        nombre,
                        respuesta.status
                    );

                    setStatus(
                        "❌ " + tipo + " NO ENCONTRADA",
                        'No encuentro "' + nombre + '"',
                        "error"
                    );

                    return false;
                }

                console.log(
                    "✅ Encontrado:",
                    nombre
                );

                return true;

            } catch (error) {

                console.error(
                    "❌ Error verificando:",
                    nombre,
                    error
                );

                setStatus(
                    "⚠️ ERROR",
                    "No se pudo comprobar " + nombre,
                    "error"
                );

                return false;
            }
        }


        async function verificarArchivos() {

            setStatus(
                "🔍 VERIFICANDO",
                "Buscando ROM y BIOS...",
                "cargando"
            );


            // Primero BIOS

            const biosOK =
                await verificarArchivo(
                    MI_BIOS,
                    "BIOS"
                );

            if (!biosOK) {
                return false;
            }


            // Después ROM

            const romOK =
                await verificarArchivo(
                    MI_ROM,
                    "ROM"
                );

            if (!romOK) {
                return false;
            }


            setStatus(
                "✅ ARCHIVOS ENCONTRADOS",
                NOMBRE_JUEGO + " — iniciando...",
                "ok"
            );

            return true;
        }


        // ============================================================
        // CONFIGURAR EMULATORJS
        // ============================================================

        function configurarEmulador() {

            /*
             * IMPORTANTE:
             * EmulatorJS debe recibir estas variables
             * ANTES de cargar loader.js.
             */

            window.EJS_player = "#game";

            // Core FBNeo
            window.EJS_core = "fbneo";

            // ROM
            window.EJS_gameUrl = MI_ROM;

            // BIOS Neo Geo
            window.EJS_biosUrl = MI_BIOS;

            // Datos de EmulatorJS
            window.EJS_pathtodata =
                "https://cdn.emulatorjs.org/stable/data/";

            window.EJS_gameName =
                NOMBRE_JUEGO;

            window.EJS_DEBUG = false;

            console.log("🎮 EmulatorJS configurado");
            console.log("📁 ROM:", MI_ROM);
            console.log("📁 BIOS:", MI_BIOS);
            console.log("🎯 CORE:", window.EJS_core);
        }


        // ============================================================
        // CARGAR EMULATORJS
        // ============================================================

        function cargarLoader() {

            return new Promise((resolve, reject) => {

                setStatus(
                    "🔄 CARGANDO",
                    "Descargando EmulatorJS...",
                    "cargando"
                );


                const script =
                    document.createElement("script");

                script.src =
                    "https://cdn.emulatorjs.org/stable/data/loader.js";

                script.onload = () => {

                    console.log(
                        "✅ EmulatorJS loader cargado"
                    );

                    resolve();

                };

                script.onerror = () => {

                    console.error(
                        "❌ No se pudo cargar loader.js"
                    );

                    setStatus(
                        "❌ ERROR DEL EMULADOR",
                        "No se pudo cargar EmulatorJS",
                        "error"
                    );

                    reject(
                        new Error(
                            "No se pudo cargar EmulatorJS"
                        )
                    );
                };


                document.head.appendChild(script);
            });
        }


        // ============================================================
        // INICIAR
        // ============================================================

        async function iniciar() {

            try {

                const archivosOK =
                    await verificarArchivos();

                if (!archivosOK) {
                    return;
                }


                configurarEmulador();

                await cargarLoader();


                setStatus(
                    "🎮 INICIANDO",
                    "Cargando " + NOMBRE_JUEGO + "...",
                    "cargando"
                );


            } catch (error) {

                console.error(
                    "❌ Error:",
                    error
                );

                setStatus(
                    "❌ ERROR",
                    "No se pudo iniciar el emulador",
                    "error"
                );
            }
        }


        // ============================================================
        // MONEDA
        // ============================================================

        function insertarMoneda() {

            console.log("💰 Moneda");

            document.dispatchEvent(
                new KeyboardEvent("keydown", {
                    key: "5",
                    code: "Digit5",
                    bubbles: true
                })
            );

            setTimeout(() => {

                document.dispatchEvent(
                    new KeyboardEvent("keyup", {
                        key: "5",
                        code: "Digit5",
                        bubbles: true
                    })
                );

            }, 100);


            setStatus(
                "💰 MONEDA INSERTADA",
                "Presiona Start para jugar",
                "ok"
            );
        }


        // ============================================================
        // START
        // ============================================================

        function presionarStart() {

            console.log("▶ Start");

            document.dispatchEvent(
                new KeyboardEvent("keydown", {
                    key: "Enter",
                    code: "Enter",
                    bubbles: true
                })
            );

            setTimeout(() => {

                document.dispatchEvent(
                    new KeyboardEvent("keyup", {
                        key: "Enter",
                        code: "Enter",
                        bubbles: true
                    })
                );

            }, 100);


            setStatus(
                "▶ START",
                "Iniciando partida...",
                "ok"
            );
        }


        // ============================================================
        // PANTALLA COMPLETA
        // ============================================================

        function pantallaCompleta() {

            const elem =
                document.getElementById("game");

            if (!document.fullscreenElement) {

                if (elem.requestFullscreen) {

                    elem.requestFullscreen();

                } else if (elem.webkitRequestFullscreen) {

                    elem.webkitRequestFullscreen();
                }

            } else {

                if (document.exitFullscreen) {

                    document.exitFullscreen();

                } else if (document.webkitExitFullscreen) {

                    document.webkitExitFullscreen();
                }
            }
        }


        // ============================================================
        // SALIR
        // ============================================================

        function salirJuego() {

            if (
                confirm(
                    "¿Seguro que quieres salir?"
                )
            ) {
                location.reload();
            }
        }


        // ============================================================
        // EVENTOS
        // ============================================================

        document
            .getElementById("btnCoin")
            .addEventListener(
                "click",
                insertarMoneda
            );

        document
            .getElementById("btnStart")
            .addEventListener(
                "click",
                presionarStart
            );

        document
            .getElementById("btnFullscreen")
            .addEventListener(
                "click",
                pantallaCompleta
            );

        document
            .getElementById("btnQuit")
            .addEventListener(
                "click",
                salirJuego
            );


        // ============================================================
        // INICIO
        // ============================================================

        if (
            document.readyState === "loading"
        ) {

            document.addEventListener(
                "DOMContentLoaded",
                iniciar
            );

        } else {

            iniciar();
        }


        console.log("==============================");
        console.log("🎮 ARCADE P2P");
        console.log("📁 ROM:", MI_ROM);
        console.log("📁 BIOS:", MI_BIOS);
        console.log("==============================");

    </script>

</body>
</html>
