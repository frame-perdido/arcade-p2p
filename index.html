<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎮 ARCADE P2P</title>
    
    <!-- ========================================== -->
    <!-- 1. CARGA DEL EMULADOR (DESDE CDN)          -->
    <!-- ========================================== -->
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        /* Contenedor del emulador */
        #game {
            width: 100%;
            height: 100vh;
            background: #000;
        }
        
        /* Panel de estado (visible) */
        #status-panel {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            padding: 12px 24px;
            border-radius: 10px;
            border: 2px solid #4d96ff;
            color: white;
            font-size: 14px;
            z-index: 999;
            text-align: center;
            min-width: 300px;
            max-width: 90%;
            pointer-events: none;
            transition: all 0.3s;
        }
        
        #status-panel .titulo {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        #status-panel .detalle {
            font-size: 13px;
            color: #aaa;
        }
        
        #status-panel.ok {
            border-color: #2ecc71;
        }
        
        #status-panel.error {
            border-color: #e74c3c;
        }
        
        #status-panel.cargando {
            border-color: #f39c12;
        }
        
        /* Controles táctiles */
        #controles {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 100;
            padding: 10px;
            flex-wrap: wrap;
            background: rgba(0,0,0,0.7);
        }
        
        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            min-width: 80px;
            transition: transform 0.1s;
            user-select: none;
        }
        
        .btn:active {
            transform: scale(0.9);
        }
        
        .btn-coin {
            background: #f1c40f;
            color: #000;
        }
        
        .btn-start {
            background: #2ecc71;
            color: #000;
        }
        
        .btn-quit {
            background: #e74c3c;
            color: #fff;
        }
        
        .btn-fullscreen {
            background: #3498db;
            color: #fff;
        }
        
        /* Responsive */
        @media (max-width: 500px) {
            .btn {
                padding: 14px 20px;
                font-size: 15px;
                min-width: 60px;
            }
            #status-panel {
                font-size: 12px;
                min-width: 200px;
                padding: 8px 16px;
            }
            #status-panel .titulo {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- 2. PANEL DE ESTADO (MUESTRA QUÉ PASA)      -->
    <!-- ========================================== -->
    <div id="status-panel" class="cargando">
        <div class="titulo" id="statusTitulo">⏳ Iniciando...</div>
        <div class="detalle" id="statusDetalle">Cargando emulador...</div>
    </div>

    <!-- ========================================== -->
    <!-- 3. CONTENEDOR DEL EMULADOR                 -->
    <!-- ========================================== -->
    <div id="game"></div>

    <!-- ========================================== -->
    <!-- 4. CONTROLES TÁCTILES                      -->
    <!-- ========================================== -->
    <div id="controles">
        <button class="btn btn-coin" id="btnCoin">💰 Moneda</button>
        <button class="btn btn-start" id="btnStart">▶ Start</button>
        <button class="btn btn-fullscreen" id="btnFullscreen">⛶ Pantalla</button>
        <button class="btn btn-quit" id="btnQuit">✕ Salir</button>
    </div>

    <!-- ========================================== -->
    <!-- 5. SCRIPT COMPLETO                         -->
    <!-- ========================================== -->
    <script>
        // ============================================================
        //  CONFIGURACIÓN - ¡CAMBIÁ AQUÍ TUS ARCHIVOS!
        // ============================================================
        const MI_ROM = "kof96ep.zip";        // ← NOMBRE DE TU ROM
        const MI_BIOS = "neogeo.zip";        // ← NOMBRE DE TU BIOS
        const NOMBRE_JUEGO = "KOF 10th Anniversary";

        // ============================================================
        //  ELEMENTOS DOM
        // ============================================================
        const statusTitulo = document.getElementById('statusTitulo');
        const statusDetalle = document.getElementById('statusDetalle');
        const statusPanel = document.getElementById('status-panel');

        // ============================================================
        //  FUNCIONES DE ESTADO
        // ============================================================
        function setStatus(titulo, detalle, tipo) {
            statusTitulo.textContent = titulo;
            statusDetalle.textContent = detalle;
            statusPanel.className = tipo || 'cargando';
            console.log(`📌 ${titulo} - ${detalle}`);
        }

        // ============================================================
        //  VERIFICAR ARCHIVOS (MUESTRA EN PANTALLA)
        // ============================================================
        async function verificarArchivos() {
            setStatus('🔍 Verificando...', 'Buscando BIOS y ROM...', 'cargando');
            
            try {
                // Verificar BIOS
                const biosResp = await fetch(MI_BIOS, { method: 'HEAD' });
                if (!biosResp.ok) {
                    setStatus('❌ BIOS NO ENCONTRADA', 
                        `No encuentro "${MI_BIOS}" en la carpeta`, 'error');
                    return false;
                }
                
                // Verificar ROM
                const romResp = await fetch(MI_ROM, { method: 'HEAD' });
                if (!romResp.ok) {
                    setStatus('❌ ROM NO ENCONTRADA', 
                        `No encuentro "${MI_ROM}" en la carpeta`, 'error');
                    return false;
                }
                
                setStatus('✅ ARCHIVOS ENCONTRADOS', 
                    `BIOS y ROM correctos. Cargando ${NOMBRE_JUEGO}...`, 'ok');
                return true;
                
            } catch (error) {
                setStatus('⚠️ ERROR DE CONEXIÓN', 
                    '¿Usas servidor local? (python -m http.server 8000)', 'error');
                console.error('Error:', error);
                return false;
            }
        }

        // ============================================================
        //  CARGAR EMULADOR
        // ============================================================
        async function cargarEmulador() {
            // Verificar archivos primero
            const archivosOK = await verificarArchivos();
            if (!archivosOK) {
                return;
            }

            setStatus('🔄 CARGANDO', 'Descargando emulador...', 'cargando');

            try {
                // Configurar EmulatorJS
                window.EJS_player = "#game";
                window.EJS_core = "fbneo";
                window.EJS_gameUrl = MI_ROM;
                window.EJS_biosUrl = MI_BIOS;
                window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
                window.EJS_gameName = NOMBRE_JUEGO;
                window.EJS_forceISOsystem = true;
                window.EJS_DEBUG = false;

                // El emulador se carga automáticamente con el script de arriba
                
                // Esperar a que cargue
                let intentos = 0;
                const maxIntentos = 30;
                
                const esperarCarga = setInterval(() => {
                    intentos++;
                    const gameDiv = document.getElementById('game');
                    
                    // Si hay un canvas o iframe, el emulador cargó
                    if (gameDiv.querySelector('canvas, iframe')) {
                        setStatus('🎮 ¡LISTO!', 
                            `Presiona "Moneda" y luego "Start" para jugar`, 'ok');
                        clearInterval(esperarCarga);
                    } else if (intentos >= maxIntentos) {
                        setStatus('⏳ CARGANDO...', 
                            'El emulador puede tardar hasta 30 segundos', 'cargando');
                    }
                }, 1000);

                // Si después de 10 segundos no hay cambios, mostrar mensaje
                setTimeout(() => {
                    const gameDiv = document.getElementById('game');
                    if (!gameDiv.querySelector('canvas, iframe')) {
                        setStatus('⏳ DESCARGANDO EMULADOR...', 
                            'Puede tardar varios segundos', 'cargando');
                    }
                }, 5000);

                // Después de 30 segundos, si no cargó
                setTimeout(() => {
                    const gameDiv = document.getElementById('game');
                    if (!gameDiv.querySelector('canvas, iframe')) {
                        setStatus('⚠️ TARDA MÁS DE LO NORMAL', 
                            'Revisa la consola (F12) para errores', 'cargando');
                    }
                }, 30000);

            } catch (error) {
                setStatus('❌ ERROR AL CARGAR', error.message, 'error');
                console.error('Error:', error);
            }
        }

        // ============================================================
        //  FUNCIONES DE LOS BOTONES
        // ============================================================
        
        function insertarMoneda() {
            // Tecla 5 = moneda en Neo Geo
            const evento = new KeyboardEvent('keydown', { 
                key: '5', 
                code: 'Digit5', 
                bubbles: true 
            });
            document.dispatchEvent(evento);
            
            setTimeout(() => {
                const eventoUp = new KeyboardEvent('keyup', { 
                    key: '5', 
                    code: 'Digit5', 
                    bubbles: true 
                });
                document.dispatchEvent(eventoUp);
            }, 100);
            
            setStatus('💰 MONEDA INSERTADA', 'Presiona Start para jugar', 'ok');
            console.log('💰 Moneda insertada');
        }

        function presionarStart() {
            // Tecla Enter = Start
            const evento = new KeyboardEvent('keydown', { 
                key: 'Enter', 
                code: 'Enter', 
                bubbles: true 
            });
            document.dispatchEvent(evento);
            
            setTimeout(() => {
                const eventoUp = new KeyboardEvent('keyup', { 
                    key: 'Enter', 
                    code: 'Enter', 
                    bubbles: true 
                });
                document.dispatchEvent(eventoUp);
            }, 100);
            
            setStatus('▶ INICIANDO', '¡A jugar!', 'ok');
            console.log('▶ Start presionado');
        }

        function pantallaCompleta() {
            const elem = document.getElementById('game');
            if (!document.fullscreenElement) {
                elem.requestFullscreen?.() || elem.webkitRequestFullscreen?.();
            } else {
                document.exitFullscreen?.() || document.webkitExitFullscreen?.();
            }
        }

        function salirJuego() {
            if (confirm('¿Seguro que quieres salir?')) {
                location.reload();
            }
        }

        // ============================================================
        //  ASIGNAR EVENTOS A LOS BOTONES
        // ============================================================
        document.getElementById('btnCoin').addEventListener('click', insertarMoneda);
        document.getElementById('btnStart').addEventListener('click', presionarStart);
        document.getElementById('btnFullscreen').addEventListener('click', pantallaCompleta);
        document.getElementById('btnQuit').addEventListener('click', salirJuego);

        // ============================================================
        //  INICIAR
        // ============================================================
        document.addEventListener('DOMContentLoaded', cargarEmulador);

        // ============================================================
        //  LOG EN CONSOLA
        // ============================================================
        console.log('🎮 ARCADE P2P');
        console.log('📁 ROM:', MI_ROM);
        console.log('📁 BIOS:', MI_BIOS);
        console.log('📌 Los archivos deben estar en la MISMA carpeta');
        console.log('📌 Usa: python -m http.server 8000');
        console.log('📌 Abre: http://localhost:8000');
        console.log('========================================');
        console.log('🟢 Si ves errores, revisa la consola');
        console.log('🟢 El emulador se carga desde CDN');
    </script>
</body>
</html>
